name: Validate POOPBOT MENU V2
on:
  push:
    branches: [main, v2-standalone-quest]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate HTML and required controls
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path("index.html").read_text()
          for token in ['POOPBOT MENU V2','data-view="home"','data-view="visuals"','data-view="audio"','data-view="settings"','data-view="about"','id="enter-vr"','id="test-sound"','id="reset-settings"','./app.js','./vr.mjs','manifest.webmanifest']:
              assert token in html, f"Missing: {token}"
          print("HTML feature markers: PASS")
          PY
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check vr.mjs
          node --check sw.js
      - name: Validate web app manifest
        run: python -m json.tool manifest.webmanifest > /dev/null
      - name: Check preview launcher
        run: bash -n scripts/preview.sh
