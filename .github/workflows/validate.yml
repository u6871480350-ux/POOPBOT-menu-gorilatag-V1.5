name: Validate POOPBOT prototype

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate HTML structure and expected controls
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          source = Path("index.html").read_text(encoding="utf-8")

          class Checker(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.buttons = 0
                  self.scripts = []
                  self.in_script = False
                  self.current_script = []

              def handle_starttag(self, tag, attrs):
                  if tag == "button":
                      self.buttons += 1
                  if tag == "script":
                      self.in_script = True
                      self.current_script = []

              def handle_data(self, data):
                  if self.in_script:
                      self.current_script.append(data)

              def handle_endtag(self, tag):
                  if tag == "script" and self.in_script:
                      self.scripts.append("".join(self.current_script))
                      self.in_script = False

          checker = Checker()
          checker.feed(source)
          checker.close()

          assert "<title>POOPBOT MENU V1.5</title>" in source, "Missing page title"
          assert checker.buttons == 8, f"Expected 8 demo buttons; found {checker.buttons}"
          assert 'data-toggle="LONG ARMS"' in source, "Missing Long Arms demo control"
          assert 'data-toggle="FLIGHT"' in source, "Missing Flight demo control"
          assert 'data-action="reset"' in source, "Missing Reset button"
          assert "NOT CONNECTED TO GORILLA TAG" in source, "Missing prototype scope notice"
          assert checker.scripts, "No inline JavaScript found"
          Path("/tmp/poopbot-inline.js").write_text("\n".join(checker.scripts), encoding="utf-8")
          print("HTML structure and expected controls: PASS")
          PY
      - name: Check JavaScript syntax
        run: node --check /tmp/poopbot-inline.js
      - name: Confirm no remote scripts or image assets
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("index.html").read_text(encoding="utf-8").lower()
          assert '<script src="http' not in source, "Unexpected remote script dependency"
          assert '<img ' not in source, "Unexpected image dependency"
          print("Self-contained page dependency check: PASS")
          PY
